[pytest]
# 在项目根目录执行 pytest。pythonpath 让 common、config、encapsulation 可以被导入。
pythonpath = .
testpaths = testcase
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -vs --alluredir=output/results --clean-alluredir
markers =
    insurance: 保险出单接口用例
log_level = INFO
filterwarnings =
    ignore::DeprecationWarning
